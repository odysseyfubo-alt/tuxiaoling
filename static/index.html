<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>途小灵 · AI旅行规划助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="chat-header">
      <div class="brand">
        <div class="logo">✈️</div>
        <div>
          <h1>途小灵</h1>
          <span class="status"><i class="dot"></i>在线 · AI 旅行规划师</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnNew" class="icon-btn" title="新对话">＋</button>
        <button id="btnClear" class="icon-btn" title="清空当前会话">🗑</button>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <footer class="composer">
      <div id="imagePreview" class="image-preview" hidden>
        <img id="previewImg" alt="图片预览" />
        <button id="removeImage" class="remove-img" title="移除图片">×</button>
      </div>
      <div class="input-wrap">
        <button id="btnImage" class="icon-btn" title="上传图片">🖼</button>
        <textarea id="input" rows="1" placeholder="输入你想去的城市或旅行问题，例如：帮我规划成都三天两晚的行程"></textarea>
        <button id="btnSend" class="send-btn" title="发送">➤</button>
        <button id="btnStop" class="stop-btn" title="停止生成" hidden>■</button>
      </div>
      <p class="hint">途小灵基于实时天气与联网搜索生成内容，仅供参考 · Enter 发送 / Shift+Enter 换行</p>
    </footer>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden />
  <div id="lightbox" class="lightbox" hidden>
    <img id="lightboxImg" alt="图片预览" />
    <button id="lightboxClose" class="lightbox-close" title="关闭">×</button>
    <div class="lightbox-bar">
      <button id="lightboxZoomOut" class="lightbox-btn" title="缩小">－</button>
      <span id="lightboxZoomLabel" class="lightbox-label">100%</span>
      <button id="lightboxZoomIn" class="lightbox-btn" title="放大">＋</button>
      <button id="lightboxZoomReset" class="lightbox-btn" title="重置">1:1</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
